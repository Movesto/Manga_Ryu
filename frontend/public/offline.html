<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Manga Ryu</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #09090b; color: #f4f4f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
      }
      .box { max-width: 320px; }
      .dot { font-size: 44px; }
      h1 { font-size: 20px; margin: 12px 0 6px; }
      p { color: #8a8a93; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #f97316; color: #111; border: 0; font-weight: 600;
        padding: 10px 18px; border-radius: 10px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dot">🐲</div>
      <h1>You're offline</h1>
      <p>Manga Ryu needs a connection to load new pages. Chapters you've already opened are still readable.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
