name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimum permissions — only escalate where needed
permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub Security tab

# Cancel superseded runs on rapid pushes to the same ref
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ── Job 1: Secret Scanning ────────────────────────────────────────────────
  # Scans the full git history for leaked credentials, API keys, tokens.
  # Fails immediately if any secret is found — this is a hard gate.
  secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history, not just the latest commit

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  # ── Job 2: SAST ───────────────────────────────────────────────────────────
  # Static analysis: finds security bugs in source code without running it.
  # Covers OWASP Top 10, Python, FastAPI, JWT, React, TypeScript rule sets.
  # Uploads findings to GitHub Security → Code Scanning tab as SARIF.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Semgrep
        run: pip install semgrep

      # SARIF pass for the Security tab (never fails the job on its own).
      - name: Run Semgrep — collect all findings (SARIF)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/fastapi \
            --config p/jwt \
            --config p/react \
            --config p/typescript \
            --sarif \
            --output semgrep.sarif \
            --exclude .venv \
            --exclude node_modules \
            --exclude build
        continue-on-error: true   # always produce SARIF even when findings exist

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true   # private repos without GHAS will get "not accessible"
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Gate on ERROR-severity findings using Semgrep's native exit code, which
      # correctly resolves rule severity and honors `# nosemgrep` suppressions.
      # (A SARIF/jq gate is unreliable: Semgrep leaves result.level unset and
      # carries severity on the rule definition instead.)
      - name: Fail on ERROR-severity findings
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/fastapi \
            --config p/jwt \
            --config p/react \
            --config p/typescript \
            --severity ERROR \
            --error \
            --exclude .venv \
            --exclude node_modules \
            --exclude build

  # ── Job 3a: SCA — Python ─────────────────────────────────────────────────
  # Checks backend Python dependencies against known CVE databases.
  # pip-audit uses OSV + PyPI Advisory DB — no token needed.
  sca-backend:
    name: SCA — Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      # Single audit run: the JSON report and the pass/fail gate share it
      # (previously pip-audit resolved all dependencies twice).
      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.txt -r backend/requirements-ml.txt \
            --format json --output pip-audit.json
        continue-on-error: true   # collect the report regardless

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json

      - name: Fail on any vulnerability
        run: |
          VULNS=$(jq '[.dependencies[]?.vulns[]?] | length' pip-audit.json)
          echo "vulnerabilities found: $VULNS"
          if [ "$VULNS" -gt 0 ]; then
            jq -r '.dependencies[] | select((.vulns | length) > 0)
              | "\(.name) \(.version): \([.vulns[].id] | join(", "))"' pip-audit.json
            exit 1
          fi

  # ── Job 3b: SCA — Node.js ────────────────────────────────────────────────
  # Checks frontend npm dependencies against the npm advisory database.
  # --audit-level=high means LOW/MODERATE don't fail the build.
  sca-frontend:
    name: SCA — Node.js (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  # ── Job 4: Container Scan ─────────────────────────────────────────────────
  # Builds both Docker images and scans them for OS/library CVEs.
  # Uploads CRITICAL/HIGH findings to the GitHub Security tab as SARIF.
  # Fails on any unfixed CRITICAL or HIGH vulnerability.
  #
  # IMPORTANT: build with the SAME args the VM uses (see docker-compose.prod.yml)
  # so we scan the artifact we actually ship. The backend runs INSTALL_ML=false
  # (the 1 GB VM can't fit torch), so the heavy ML stack must not be in the
  # scanned image either — otherwise Trivy fails on ML-only CVEs that never
  # reach prod.
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            build-args: --build-arg INSTALL_ML=false
          - service: frontend
            context: ./frontend
            build-args: ""
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.service }} image
        run: docker build ${{ matrix.build-args }} --provenance=false --sbom=false -t manga-${{ matrix.service }}:scan ${{ matrix.context }}

      - name: Run Trivy — collect SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Never treat an SBOM file found *inside* the image as a package
          # source. Wheels ship build-time CycloneDX receipts under
          # `<pkg>.dist-info/sboms/`; Trivy parses them as a third-party SBOM
          # and reports their frozen component versions as image CVEs. The
          # Dockerfile deletes them, this is the belt-and-braces for anything a
          # future base image drops elsewhere.
          TRIVY_SKIP_FILES: "**/*.cdx.json,**/*.spdx.json,**/*.cyclonedx.json,**/dist-info/sboms/**"
        with:
          image-ref: manga-${{ matrix.service }}:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        continue-on-error: true # always produce SARIF even when findings exist

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true   # private repos without GHAS will get "not accessible"
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

      - name: Fail on unfixed CRITICAL/HIGH CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: manga-${{ matrix.service }}:scan
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          TRIVY_SKIP_DB_UPDATE: true   # DB already fetched by the first Trivy step
          TRIVY_SKIP_FILES: "**/*.cdx.json,**/*.spdx.json,**/*.cyclonedx.json,**/dist-info/sboms/**"

