# Lean Netdata config for the 1 GB Oracle VM.
# Long-term history lives in Netdata Cloud; the local agent keeps only a small
# in-RAM window and skips the expensive collectors, so its footprint stays low.

[global]
    # Coarser sampling than the 1s default — plenty for a small single node
    update every = 2

[db]
    # In-memory ring buffer only (no on-disk dbengine files); Cloud has history
    mode = ram
    # ~30 min of local retention (seconds)
    retention = 1800

[ml]
    # Anomaly-detection training is the biggest RAM/CPU cost — off on this box
    enabled = no

[health]
    enabled = yes

[plugins]
    # Disable the heavy / host-intrusive collectors we don't need here
    ebpf = no
    apps = no
    python.d = no
    charts.d = no
    node.d = no
    slabinfo = no
    perf = no
    nfacct = no
    # Keep the essentials: system, cgroups (per-container), and Go collectors
    proc = yes
    cgroups = yes
    go.d = yes
    diskspace = yes
    idlejitter = no
