version: '3.8'

services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:latest
    container_name: suwayomi-engine
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "4567:4567"
    volumes:
      - ./suwayomi-data:/home/suwayomi/.local/share/Tachidesk
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: manga-postgres
    environment:
      POSTGRES_DB: manga_db
      POSTGRES_USER: manga
      POSTGRES_PASSWORD: manga
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data: