# Production stack for the Oracle Cloud VM.Standard.E2.1.Micro (1 OCPU / 1 GB).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Sized for 1 GB RAM + a 2 GB swap file (see oracle-setup.sh):
#   - images are pulled from GHCR (built by CI without the ML tagger deps)
#   - every service has a memory cap; Suwayomi's JVM heap is bounded
#   - nothing binds a host port — ingress is exclusively the Cloudflare Tunnel

services:

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi-engine
    environment:
      # Bounded heap + SerialGC: kindest JVM setup for 1 vCPU / small RAM
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Xmx384m -XX:+UseSerialGC"
    expose:
      - "4567"
    volumes:
      - suwayomi-data:/home/suwayomi/.local/share/Tachidesk
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4567/api/v1/settings/about/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: manga-postgres
    command: postgres -c shared_buffers=32MB -c max_connections=40
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manga_db}
      POSTGRES_USER: ${POSTGRES_USER:-manga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manga} -d ${POSTGRES_DB:-manga_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/movesto/manga-ryu-backend:${IMAGE_TAG:-latest}
    container_name: manga-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manga}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-manga_db}
      SUWAYOMI_URL: http://suwayomi:4567
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      KCC_PATH: ${KCC_PATH:-}
    expose:
      - "8000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      suwayomi:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/movesto/manga-ryu-frontend:${IMAGE_TAG:-latest}
    container_name: manga-frontend
    environment:
      API_URL: http://backend:8000
      MEDIA_URL: http://suwayomi:4567
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:3000/manifest.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Ingress: outbound-only tunnel to Cloudflare. In the Zero Trust dashboard,
  # point the tunnel's public hostname (mangaryu.org) at http://frontend:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: manga-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    networks:
      - internal
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  suwayomi-data:
